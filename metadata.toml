hw = """
Any x86-64 or ARM64 machine with one CPU core, 1 GB of RAM and about 500 MB of
disk (62 MB working tree, 315 MB Python virtual environment, 114 MB git history
if cloned with history). Peak resident memory during the reproduction is 431 MB,
measured in the cross-benchmark module. The full reproduction takes about 15
seconds. The evaluated path runs on CPU; the Colab free tier or the Dockerfile
at the repository root is sufficient. The collection pipeline is included for
inspection; running it again would need an NVIDIA GPU with at least 24 GB of
VRAM (the authors used six RTX PRO 6000).
"""

sw = """
Linux x86-64 (tested on Ubuntu 24.04; macOS and WSL are expected to work), bash,
and Python 3.12, 3.13 or 3.14 (all three verified). install.sh uses uv when
present and python3 -m venv with pip otherwise; on Debian and Ubuntu that needs
the python3-venv package. Four pinned Python packages: numpy 2.4.2, scipy
1.17.0, matplotlib 3.10.9, pandas 2.2.3. Docker (python:3.12-slim image, offline
at run time) or Google Colab work as alternatives to a local install.
"""

